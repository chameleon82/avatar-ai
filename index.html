<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Avatar with OpenAI and TTS</title>
    <link rel="stylesheet" href="src/style/main.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/three@0.136/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.umd.min.js"></script>

    <script type="module" src="src/js/main.js"></script>


    <!--<script src="https://cdn.jsdelivr.net/npm/meyda@5.0.0/dist/web/meyda.min.js"></script> -->
</head>
<body>
<div class="top-controls">
    <button id="fullscreen" class="mic" aria-label="Fullscreen" title="Fullscreen">
        <i class="fa-solid fa-expand"></i>
    </button>

    <button id="settings" class="mic" aria-label="Settings" title="Settings">
        <i class="fa-solid fa-gear"></i>
    </button>
</div>

<div class="input-container">
    <label for="inputField" class="visually-hidden">Ask me anything</label>
    <textarea placeholder="Ask me anything here" name="text" id="inputField" rows="4"></textarea>

    <button id="mic" class="mic" aria-label="Start voice input" aria-controls="inputField">
        <i class="fa-solid fa-microphone"></i>
    </button>

    <button id="cam" class="mic" aria-label="Toggle camera" title="Toggle camera">
        <i class="fa-solid fa-camera"></i>
    </button>

</div>


<!-- Small camera preview (64x64) -->
<video id="camPreview" width="64" height="64" style="
    position: fixed;
    right: 12px;
    bottom: 90px;
    width: 64px;
    height: 64px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.25);
    object-fit: cover;
    display: none;
    z-index: 9999;
" autoplay playsinline muted></video>


<!-- Settings Modal -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h2>Settings</h2>
        <p>
            Configure OpenAI connection settings. Note: storing an API key in the browser is not secure.
            Use “Remember API key” only on a trusted device.
        </p>

        <label for="baseUrlInput" style="display:block;margin-top:10px;">OpenAI Base URL</label>
        <input
                type="text"
                id="baseUrlInput"
                placeholder="https://api.openai.com"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
                aria-label="OpenAI Base URL input"/>

        <label for="modelInput" style="display:block;margin-top:10px;">Realtime model</label>
        <input
                type="text"
                id="modelInput"
                placeholder="gpt-realtime-mini"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
                aria-label="Realtime model input"/>

        <label for="avatarInput" style="display:block;margin-top:10px;">Avatar</label>
        <select id="avatarInput" aria-label="Avatar selection">
            <option value="avatar-w">Woman — Sage</option>
            <option value="avatar">White man — Alloy</option>
            <option value="avatar-m">Dark man — Echo</option>
        </select>

        <label for="apiKeyInput" style="display:block;margin-top:10px;">OpenAI API Key</label>
        <input
                type="password"
                id="apiKeyInput"
                placeholder="sk-..."
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
                aria-label="API Key input"/>

        <div style="margin-top:10px;display:flex;gap:10px;align-items:center;">
            <input type="checkbox" id="rememberKey"/>
            <label for="rememberKey">Remember API key on this device</label>
        </div>

        <label for="customInstructionsInput" style="display:block;margin-top:10px;">Custom instructions
            (optional)</label>
        <textarea
                id="customInstructionsInput"
                rows="6"
                placeholder="Extra behavior rules for Milena…"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
                aria-label="Custom instructions input"
                style="width:100%;resize:vertical;"></textarea>


        <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
            <button id="saveSettings">Save</button>
            <button id="cancelSettings">Cancel</button>
            <button id="clearSettings" style="margin-left:auto;">Clear saved key</button>
        </div>
    </div>
</div>

<!-- Visible only with ?avatarDebug=1 or localStorage avatarDebug=1. -->
<section id="avatarAdjusters" class="avatar-adjusters" hidden aria-label="Avatar debug adjusters">
    <div class="avatar-adjusters-header">
        <strong>Avatar debug adjusters</strong>
        <button id="avatarAdjustersClose" type="button" aria-label="Close debug adjusters">×</button>
    </div>
    <p>Drag sliders to tune the current arm pose. Changes apply live.</p>
    <div class="avatar-adjusters-grid">
        <label>Left arm lift <output id="leftArmLiftValue">0.00</output><input id="leftArmLiftAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Right arm lift <output id="rightArmLiftValue">0.00</output><input id="rightArmLiftAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Left arm side <output id="leftArmSideValue">0.00</output><input id="leftArmSideAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Right arm side <output id="rightArmSideValue">0.00</output><input id="rightArmSideAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Left elbow bend <output id="leftForearmBendValue">0.00</output><input id="leftForearmBendAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Right elbow bend <output id="rightForearmBendValue">0.00</output><input id="rightForearmBendAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Left hand twist <output id="leftHandTwistValue">0.00</output><input id="leftHandTwistAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Right hand twist <output id="rightHandTwistValue">0.00</output><input id="rightHandTwistAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Left finger curl <output id="leftFingerCurlValue">0.00</output><input id="leftFingerCurlAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Right finger curl <output id="rightFingerCurlValue">0.00</output><input id="rightFingerCurlAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Left finger spread <output id="leftFingerSpreadValue">0.00</output><input id="leftFingerSpreadAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Right finger spread <output id="rightFingerSpreadValue">0.00</output><input id="rightFingerSpreadAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Shoulder lift <output id="shoulderLiftValue">0.00</output><input id="shoulderLiftAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Posture <output id="postureValue">0.00</output><input id="postureAdjuster" type="range" min="-1" max="1" step="0.01" value="0"></label>
        <label>Camera zoom <output id="avatarZoomValue">1.00×</output><input id="avatarZoomAdjuster" type="range" min="0.5" max="2.5" step="0.01" value="1"></label>
    </div>
    <div class="avatar-adjusters-actions">
        <button id="avatarAdjustersReset" type="button">Reset pose</button>
        <button id="avatarAdjustersReport" type="button">Log pose</button>
    </div>
</section>
</body>
</html>
